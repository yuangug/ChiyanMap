name: Build

on:
  pull_request:
  push:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        levilamina: ["26.10.14", "26.20.4"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
      
      - name: Cache xmake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ matrix.levilamina }}-${{ hashFiles('xmake.lua') }}
          restore-keys: |
            xmake-${{ matrix.levilamina }}-

      - name: Update xmake repository
        run: xmake repo -u

      - name: Configure xmake (LeviLamina ${{ matrix.levilamina }})
        run: xmake f -a x64 -m release -p windows --levilamina_version=${{ matrix.levilamina }} -y

      - name: Build mod
        run: xmake build ChiyanMap

      - name: Build and run pure worldgen tests
        run: |
          xmake f -a x64 -m debug -p windows --levilamina_version=${{ matrix.levilamina }} -y
          xmake build worldgen_tests
          xmake run worldgen_tests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-${{ matrix.levilamina }}-client-windows-x64
          path: bin/
